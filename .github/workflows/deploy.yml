name: Build and Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: acrmeukssyncophonie.azurecr.io
  RESOURCE_GROUP: rg-me-uks-syncophonie
  BACKEND_APP_NAME: syncophonie-backend
  FRONTEND_APP_NAME: syncophonie-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC login. 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name acrmeukssyncophonie

      - name: Build and push backend image
        run: |
          docker build --no-cache -t $REGISTRY/syncophonie-backend:${{ github.sha }} ./backend
          docker push $REGISTRY/syncophonie-backend:${{ github.sha }}
          docker tag $REGISTRY/syncophonie-backend:${{ github.sha }} $REGISTRY/syncophonie-backend:latest
          docker push $REGISTRY/syncophonie-backend:latest

      - name: Build and push frontend image
        run: |
          docker build --no-cache -t $REGISTRY/syncophonie-frontend:${{ github.sha }} ./frontend
          docker push $REGISTRY/syncophonie-frontend:${{ github.sha }}
          docker tag $REGISTRY/syncophonie-frontend:${{ github.sha }} $REGISTRY/syncophonie-frontend:latest
          docker push $REGISTRY/syncophonie-frontend:latest

      - name: Deploy backend to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.BACKEND_APP_NAME }}
          imageToDeploy: ${{ env.REGISTRY }}/syncophonie-backend:${{ github.sha }}

      - name: Deploy frontend to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.FRONTEND_APP_NAME }}
          imageToDeploy: ${{ env.REGISTRY }}/syncophonie-frontend:${{ github.sha }}
