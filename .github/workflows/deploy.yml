name: Build and Deploy to Azure Container Apps

on:
  push:
    branches: [main]

env:
  REGISTRY: ${{ secrets.AZURE_REGISTRY }}          # e.g. syncophonie.azurecr.io
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  BACKEND_APP_NAME: syncophonie-backend
  FRONTEND_APP_NAME: syncophonie-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ secrets.AZURE_REGISTRY_NAME }}

      - name: Build and push backend image
        run: |
          docker build -t $REGISTRY/syncophonie-backend:${{ github.sha }} ./backend
          docker push $REGISTRY/syncophonie-backend:${{ github.sha }}
          docker tag $REGISTRY/syncophonie-backend:${{ github.sha }} $REGISTRY/syncophonie-backend:latest
          docker push $REGISTRY/syncophonie-backend:latest

      - name: Build and push frontend image
        run: |
          docker build -t $REGISTRY/syncophonie-frontend:${{ github.sha }} ./frontend
          docker push $REGISTRY/syncophonie-frontend:${{ github.sha }}
          docker tag $REGISTRY/syncophonie-frontend:${{ github.sha }} $REGISTRY/syncophonie-frontend:latest
          docker push $REGISTRY/syncophonie-frontend:latest

      - name: Deploy backend to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.BACKEND_APP_NAME }}
          imageToDeploy: ${{ env.REGISTRY }}/syncophonie-backend:${{ github.sha }}

      - name: Deploy frontend to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.FRONTEND_APP_NAME }}
          imageToDeploy: ${{ env.REGISTRY }}/syncophonie-frontend:${{ github.sha }}
