server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Azure DNS resolver — required for nginx to resolve external FQDNs at runtime
    resolver 168.63.129.16 valid=30s;
    resolver_timeout 10s;

    # Proxy API calls to the backend container
location /api/ {
    proxy_pass https://syncophonie-backend.thankfulsmoke-6fa569bd.uksouth.azurecontainerapps.io;
    proxy_http_version 1.1;
    proxy_set_header Host syncophonie-backend.thankfulsmoke-6fa569bd.uksouth.azurecontainerapps.io;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
    proxy_connect_timeout 15s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

    # SPA fallback — all unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
